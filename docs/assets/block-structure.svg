<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" role="img" aria-label="Treeneesu block structure: an 80-byte header (nVersion, hashPrevBlock, hashMerkleRoot, nTime, nBits, nNonce) followed by the transaction list, whose first transaction is the coinbase.">
  <rect width="780" height="470" fill="#0d1319"/>
  <text x="28" y="38" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#e6edf3">Anatomy of a Treeneesu block</text>
  <text x="28" y="60" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b98a5">Field names as defined in src/primitives/block.h and src/primitives/transaction.h (CBlock = CBlockHeader + vtx).</text>

  <!-- header -->
  <rect x="28" y="78" width="470" height="252" rx="8" fill="#131c26" stroke="#10b981" stroke-width="1.6"/>
  <text x="44" y="104" font-family="'SF Mono', Consolas, monospace" font-size="14" fill="#34d399">CBlockHeader — 80 bytes, this is what gets hashed</text>
  <g font-family="'SF Mono', Consolas, monospace" font-size="12.5">
    <g fill="#c9d4e0">
      <text x="44" y="132">int32_t  nVersion</text>
      <text x="44" y="158">uint256  hashPrevBlock</text>
      <text x="44" y="184">uint256  hashMerkleRoot</text>
      <text x="44" y="210">uint32_t nTime</text>
      <text x="44" y="236">uint32_t nBits</text>
      <text x="44" y="262">uint32_t nNonce</text>
    </g>
    <g fill="#8b98a5">
      <text x="330" y="132">4 B</text>
      <text x="330" y="158">32 B · previous block's hash — the chain link</text>
      <text x="330" y="184">32 B · fingerprint of all transactions</text>
      <text x="330" y="210">4 B · timestamp (seconds)</text>
      <text x="330" y="236">4 B · PoW target, compact form</text>
      <text x="330" y="262">4 B · the number miners search over</text>
    </g>
  </g>
  <text x="44" y="296" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b98a5">SHA-256d(header) ≤ target(nBits)  →  the block is valid proof-of-work.</text>
  <text x="44" y="316" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b98a5">Treeneesu genesis nBits = 0x1e01ffff — an intentionally easy target.</text>

  <!-- arrow -->
  <line x1="263" y1="330" x2="263" y2="356" stroke="#10b981" stroke-width="2"/>
  <polygon points="263,364 257,352 269,352" fill="#10b981"/>

  <!-- body -->
  <rect x="28" y="366" width="470" height="76" rx="8" fill="#131c26" stroke="#2b3a4d" stroke-width="1.5"/>
  <text x="44" y="392" font-family="'SF Mono', Consolas, monospace" font-size="14" fill="#c9d4e0">vtx — the transactions</text>
  <text x="44" y="414" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b98a5">vtx[0] is the coinbase: it creates the block reward (50 TNSU, halving every 420,000 blocks) plus fees.</text>
  <text x="44" y="430" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b98a5">Every later entry is a payment that was waiting in the mempool.</text>

  <!-- transaction inset -->
  <rect x="522" y="78" width="230" height="364" rx="8" fill="#10161e" stroke="#2b3a4d" stroke-width="1.5"/>
  <text x="538" y="104" font-family="'SF Mono', Consolas, monospace" font-size="13.5" fill="#34d399">CTransaction</text>
  <g font-family="'SF Mono', Consolas, monospace" font-size="12" fill="#c9d4e0">
    <text x="538" y="132">int32_t nVersion</text>
    <text x="538" y="164">vin[] — inputs</text>
    <text x="538" y="222">vout[] — outputs</text>
    <text x="538" y="280">uint32_t nLockTime</text>
  </g>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8b98a5">
    <text x="538" y="182">each spends a previous</text>
    <text x="538" y="196">output (COutPoint) and</text>
    <text x="538" y="210">proves ownership (scriptSig)</text>
    <text x="538" y="240">each creates a new output:</text>
    <text x="538" y="254">nValue (in satoshi units)</text>
    <text x="538" y="268">+ scriptPubKey (the lock)</text>
    <text x="538" y="298">earliest time/height the</text>
    <text x="538" y="312">transaction may be mined</text>
  </g>
  <text x="538" y="348" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8b98a5">1 TNSU = 100,000,000 units.</text>
  <text x="538" y="366" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8b98a5">Total issuance is capped by</text>
  <text x="538" y="380" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8b98a5">the subsidy schedule at</text>
  <text x="538" y="394" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8b98a5">41,999,999.9538 TNSU.</text>
  <text x="538" y="422" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#f0b35e">A field changed = a different</text>
  <text x="538" y="436" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#f0b35e">hash = the block is rejected.</text>
</svg>
