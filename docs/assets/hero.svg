<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Treeneesu — an independent proof-of-work blockchain derived from Bitcoin Core. Experimental: no monetary value.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101820"/>
      <stop offset="1" stop-color="#0a0f14"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="340" fill="url(#bg)"/>
  <!-- faint blueprint grid -->
  <g stroke="#1b2634" stroke-width="1" opacity="0.6">
    <path d="M0 68H1200M0 136H1200M0 204H1200M0 272H1200"/>
    <path d="M150 0V340M300 0V340M450 0V340M600 0V340M750 0V340M900 0V340M1050 0V340"/>
  </g>

  <!-- peer network motif, right side -->
  <g stroke="#10b981" stroke-width="1.4" opacity="0.5">
    <line x1="905" y1="70" x2="1010" y2="120"/>
    <line x1="1010" y1="120" x2="1105" y2="65"/>
    <line x1="1010" y1="120" x2="1085" y2="195"/>
    <line x1="905" y1="70" x2="960" y2="185"/>
    <line x1="960" y1="185" x2="1085" y2="195"/>
    <line x1="905" y1="70" x2="1085" y2="195" opacity="0.35"/>
  </g>
  <g fill="#0d1319" stroke="#34d399" stroke-width="2">
    <circle cx="905" cy="70" r="9"/>
    <circle cx="1010" cy="120" r="11" fill="#10b981" stroke="#10b981"/>
    <circle cx="1105" cy="65" r="9"/>
    <circle cx="960" cy="185" r="9"/>
    <circle cx="1085" cy="195" r="9"/>
  </g>

  <!-- the chain: four linked blocks -->
  <g font-family="'SF Mono', Consolas, 'Liberation Mono', monospace">
    <g>
      <rect x="60" y="238" width="118" height="62" rx="8" fill="#131c26" stroke="#2b3a4d" stroke-width="1.5"/>
      <text x="76" y="264" font-size="12.5" fill="#34d399">BLOCK 0</text>
      <text x="76" y="284" font-size="11" fill="#8b98a5">00000091bddc…</text>
    </g>
    <line x1="178" y1="269" x2="206" y2="269" stroke="#10b981" stroke-width="2"/>
    <g>
      <rect x="206" y="238" width="118" height="62" rx="8" fill="#131c26" stroke="#2b3a4d" stroke-width="1.5"/>
      <text x="222" y="264" font-size="12.5" fill="#c9d4e0">BLOCK 1</text>
      <text x="222" y="284" font-size="11" fill="#8b98a5">hashPrevBlock →</text>
    </g>
    <line x1="324" y1="269" x2="352" y2="269" stroke="#10b981" stroke-width="2"/>
    <g>
      <rect x="352" y="238" width="118" height="62" rx="8" fill="#131c26" stroke="#2b3a4d" stroke-width="1.5"/>
      <text x="368" y="264" font-size="12.5" fill="#c9d4e0">BLOCK 2</text>
      <text x="368" y="284" font-size="11" fill="#8b98a5">hashPrevBlock →</text>
    </g>
    <line x1="470" y1="269" x2="498" y2="269" stroke="#10b981" stroke-width="2"/>
    <g>
      <rect x="498" y="238" width="118" height="62" rx="8" fill="#131c26" stroke="#10b981" stroke-width="2"/>
      <text x="514" y="264" font-size="12.5" fill="#34d399">BLOCK 3 · TIP</text>
      <text x="514" y="284" font-size="11" fill="#8b98a5">most chainwork wins</text>
    </g>
  </g>

  <!-- logo mark, small -->
  <g transform="translate(60,52) scale(0.62)">
    <rect x="2" y="2" width="92" height="92" rx="18" fill="#0d1319" stroke="#233140"/>
    <g fill="#10b981">
      <rect x="16" y="16" width="18" height="18" rx="3"/>
      <rect x="39" y="16" width="18" height="18" rx="3"/>
      <rect x="62" y="16" width="18" height="18" rx="3" fill="#34d399"/>
      <rect x="39" y="39" width="18" height="18" rx="3" fill="#0e9f6e"/>
      <rect x="39" y="62" width="18" height="18" rx="3" fill="#0b7a55"/>
    </g>
  </g>

  <text x="132" y="86" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="6" fill="#e6edf3">TREENEESU</text>
  <text x="134" y="120" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17.5" fill="#a7b6c4">An independent proof-of-work blockchain, derived from Bitcoin Core —</text>
  <text x="134" y="146" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17.5" fill="#a7b6c4">built to show how a blockchain actually works, end to end.</text>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1.6">
    <rect x="132" y="168" width="196" height="26" rx="13" fill="none" stroke="#b45309" stroke-width="1.5"/>
    <text x="146" y="185" fill="#f0b35e">EXPERIMENTAL PROJECT</text>
    <rect x="340" y="168" width="186" height="26" rx="13" fill="none" stroke="#2b3a4d" stroke-width="1.5"/>
    <text x="354" y="185" fill="#8b98a5">TNSU HAS NO MONETARY VALUE</text>
    <rect x="538" y="168" width="170" height="26" rx="13" fill="none" stroke="#2b3a4d" stroke-width="1.5"/>
    <text x="552" y="185" fill="#8b98a5">MIT · BITCOIN CORE v32</text>
  </g>
</svg>
