# Treeneesu seed/bootstrap node configuration (template)
# Place in the node's datadir as treeneesu.conf. Replace SEED2_IP and
# SEED3_IP with the other seed nodes' public IPv4 addresses.
server=1
listen=1
discover=1
dnsseed=0
port=29333
rpcport=29332
# RPC stays on localhost. Do NOT add rpcallowip for a public seed.
rpcbind=127.0.0.1
# Mesh the seed set (each seed lists the other two):
addnode=SEED2_IP:29333
addnode=SEED3_IP:29333
# Sane resource posture for a small VPS:
maxconnections=64
dbcache=256
# Keep enough history to serve synchronising peers:
prune=0
txindex=0
